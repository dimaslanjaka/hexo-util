name: Linter

on: [ push, pull_request ]

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: 💾 Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            tmp
            yarn.lock
            node_modules
            dist
          key: ${{ runner.os }}-yarn-cache
          restore-keys: ${{ runner.os }}-yarn-cache
      - name: Install Dependencies
        shell: bash
        run: touch yarn.lock && yarn install
      - name: Build Project
        run: yarn run build
      - name: Lint
        run: |
          yarn run lint
